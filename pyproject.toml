[project]
name = "bigdata-job-market"
version = "0.1.0"
description = "Big Data pipeline for collecting, processing, analyzing, and searching job market data"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12.0",
    "cloudscraper>=1.2.71",
    "confluent-kafka==2.4.0",
    "elasticsearch>=8.13.2",
    "fastapi>=0.115.6",
    "findspark>=2.0.1",
    "pandas>=3.0.2",
    "playwright>=1.58.0",
    "playwright-stealth>=2.0.3",
    "pyarrow>=18.0.0",
    "pydantic-settings>=2.6.1",
    "pyspark==3.5.1",
    "python-dotenv==1.0.1",
    "redis==5.0.4",
    "requests>=2.31.0",
    "cassandra-driver>=3.29.0",
    "uvicorn[standard]>=0.32.1",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
