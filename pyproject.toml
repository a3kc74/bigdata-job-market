[project]
name = "bigdata-job-market"
version = "0.1.0"
description = "Big Data pipeline for collecting, processing, analyzing, and searching job market data"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.12.0",
    "cloudscraper>=1.2.71",
    "confluent-kafka==2.4.0",
    "curl-cffi>=0.13.0",
    "fastapi>=0.115.6",
    "nodriver>=0.47.0",
    "playwright>=1.58.0",
    "playwright-stealth>=2.0.3",
    "pyspark>=4.1.1",
    "python-dotenv==1.0.1",
    "cassandra-driver>=3.29.0",
    "requests>=2.33.1",
    "uvicorn[standard]>=0.32.1",
    "findspark>=2.0.1",
    "pandas>=3.0.2",
    "pymongo>=4.10.1",
    "elasticsearch>=8.13.2",
    "pyarrow>=18.0.0",
    "pydantic-settings>=2.6.1",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
