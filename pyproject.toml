[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bigdata-job-market"
version = "0.1.0"
description = "Job market crawler"
requires-python = ">=3.13"
dependencies = [
  "requests",
  "beautifulsoup4",
  "cloudscraper>=1.2.71",
  "kafka-python>=2.3.1",
  "tenacity>=9.1.4",
  "curl-cffi>=0.15.0",
  "playwright>=1.59.0",
  "playwright-stealth>=2.0.3",
  "nodriver>=0.50.3",
  "pandas>=3.0.3",
]

[tool.uv]
package = false
