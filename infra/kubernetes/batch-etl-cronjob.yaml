# ============================================================
# Spark Batch ETL — CronJobs on Kubernetes (Minikube)
# Chạy chuỗi job raw -> bronze -> silver -> gold mỗi ngày
#
# Lịch trình (Dựa trên UTC, tức là lùi 7 tiếng so với VN):
# - 19:00 UTC (02:00 AM VN): raw -> bronze
# - 19:30 UTC (02:30 AM VN): bronze -> silver
# - 20:00 UTC (03:00 AM VN): silver -> gold
#
# Apply: kubectl apply -f infra/kubernetes/batch-etl-cronjob.yaml
# ============================================================

apiVersion: batch/v1
kind: CronJob
metadata:
  name: batch-etl-raw-to-bronze
  namespace: spark
  labels:
    app: batch-etl
    layer: bronze
spec:
  schedule: "0 19 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app: batch-etl
            job: raw-to-bronze
        spec:
          serviceAccountName: spark
          restartPolicy: Never
          containers:
            - name: spark-submit
              image: bigdata-job-market/spark-etl:latest
              imagePullPolicy: IfNotPresent
              command:
                - /opt/spark/bin/spark-submit
                - --master
                - k8s://https://kubernetes.default.svc:443
                - --deploy-mode
                - cluster
                - --name
                - raw-to-bronze
                - --conf
                - spark.kubernetes.namespace=spark
                - --conf
                - spark.kubernetes.authenticate.driver.serviceAccountName=spark
                - --conf
                - spark.kubernetes.container.image=bigdata-job-market/spark-etl:latest
                - --conf
                - spark.executor.instances=2
                - --conf
                - spark.executor.memory=2g
                - --conf
                - spark.driver.memory=1g
                - --conf
                - spark.sql.shuffle.partitions=50
                - --conf
                - spark.kubernetes.file.upload.path=local:///opt/spark/work-dir
                - local:///opt/spark/work-dir/apps/batch/jobs/raw_to_bronze.py
                - --date
                - $(date -d 'yesterday' +%Y-%m-%d)
              env:
                - name: HADOOP_NAME_NODE
                  value: "spark"

