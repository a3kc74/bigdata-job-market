apiVersion: batch/v1
kind: Job
metadata:
  name: minio-init
  namespace: job-market
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mc
          image: minio/mc:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: minio-secret
                  key: MINIO_ROOT_USER
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minio-secret
                  key: MINIO_ROOT_PASSWORD
            - name: MINIO_BUCKET_BRONZE
              valueFrom:
                configMapKeyRef:
                  name: minio-config
                  key: MINIO_BUCKET_BRONZE
            - name: MINIO_BUCKET_SILVER
              valueFrom:
                configMapKeyRef:
                  name: minio-config
                  key: MINIO_BUCKET_SILVER
            - name: MINIO_BUCKET_GOLD
              valueFrom:
                configMapKeyRef:
                  name: minio-config
                  key: MINIO_BUCKET_GOLD
          command:
            - /bin/sh
            - -c
            - |
              until mc alias set local http://minio:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"; do
                echo "Waiting for MinIO..."
                sleep 5
              done
              mc mb -p local/$MINIO_BUCKET_BRONZE || true
              mc mb -p local/$MINIO_BUCKET_SILVER || true
              mc mb -p local/$MINIO_BUCKET_GOLD || true
              echo "Buckets initialized"