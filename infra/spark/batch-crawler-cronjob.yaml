# Suspended Kubernetes CronJob template for the batch crawler.
#
# Airflow creates one-off Jobs from this CronJob to crawl TopCV job postings
# and write raw JSONL records directly to HDFS:
#   /raw/jobs/ingest_date=YYYY-MM-DD/raw_jobs_<timestamp>.jsonl
#
# The CronJob is suspended because Airflow is the scheduler. Do not enable the
# Kubernetes schedule unless you intentionally want it to run without Airflow.
#
# Manual test:
#   kubectl create job batch-etl-crawl-jobs-manual --from=cronjob/batch-etl-crawl-jobs -n spark
#   kubectl logs -n spark -l job-name=batch-etl-crawl-jobs-manual --tail=200 -f
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: batch-etl-crawl-jobs
  namespace: spark
spec:
  schedule: "30 18 * * *"
  suspend: true
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: spark
          restartPolicy: Never
          containers:
            - name: batch-crawler
              image: spark-job-market:latest
              imagePullPolicy: IfNotPresent
              workingDir: /opt/spark/work-dir
              command:
                - /opt/spark/bin/spark-submit
                - --master
                - local[*]
                - /opt/spark/work-dir/apps/ingestion/batch_crawler.py
              env:
                - name: PYTHONPATH
                  value: /opt/spark/work-dir
                - name: HDFS_RAW_JOBS_PATH
                  value: hdfs://hdfs-namenode.hdfs.svc.cluster.local:9000/raw/jobs
                - name: CRAWLER_STATE_DIR
                  value: /mnt/crawler-checkpoints/topcv
                - name: CRAWLER_PROCESSED_LINKS_FILE
                  value: /mnt/crawler-checkpoints/topcv/processed_links.txt
                - name: CRAWLER_FAILED_LINKS_FILE
                  value: /mnt/crawler-checkpoints/topcv/failed_links.txt
                - name: CRAWLER_MISSING_JOBS_LOG
                  value: /mnt/crawler-checkpoints/topcv/missing_jobs.log
                - name: CRAWLER_LAST_COMPLETED_PAGE_FILE
                  value: /mnt/crawler-checkpoints/topcv/last_completed_page.txt
                - name: CRAWL_OUTPUT_FORMAT
                  value: jsonl
                - name: CRAWL_CHUNK_SIZE
                  value: "10"
                - name: CRAWL_DETAIL_SLEEP_MIN_SECONDS
                  value: "5"
                - name: CRAWL_DETAIL_SLEEP_MAX_SECONDS
                  value: "10"
                - name: CRAWL_PAGE_SLEEP_MIN_SECONDS
                  value: "20"
                - name: CRAWL_PAGE_SLEEP_MAX_SECONDS
                  value: "30"
                - name: CRAWL_403_COOLDOWN_SECONDS
                  value: "200"
                - name: CRAWL_MAX_DETAIL_RETRIES
                  value: "2"
              volumeMounts:
                - name: crawler-checkpoint
                  mountPath: /mnt/crawler-checkpoints
          volumes:
            - name: crawler-checkpoint
              persistentVolumeClaim:
                claimName: batch-crawler-checkpoint-pvc
