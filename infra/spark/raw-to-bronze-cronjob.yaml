# ============================================================
# Spark Batch ETL — CronJob on Kubernetes (Minikube)
# Chạy job_raw_to_bronze.py mỗi ngày lúc 02:00 AM
#
# Apply: kubectl apply -f infra/spark/batch-etl-cronjob.yaml
# ============================================================

apiVersion: batch/v1
kind: CronJob
metadata:
  name: batch-etl-raw-to-bronze
  namespace: spark
  labels:
    app: batch-etl
    layer: bronze
spec:
  # Chạy hàng ngày lúc 02:00 AM (UTC+7 → 19:00 UTC ngày hôm trước)
  schedule: "0 19 * * *"
  concurrencyPolicy: Forbid        # Không cho chạy song song nếu job trước chưa xong
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3

  jobTemplate:
    spec:
      # Retry tối đa 2 lần nếu thất bại
      backoffLimit: 2
      template:
        metadata:
          labels:
            app: batch-etl
            job: raw-to-bronze
        spec:
          serviceAccountName: spark   # RBAC đã có trong infra/spark/10-rbac.yaml
          restartPolicy: Never

          containers:
            - name: spark-submit
              image: spark-job-market:latest
              imagePullPolicy: IfNotPresent

              command:
                - /opt/spark/bin/spark-submit
                - --master
                - k8s://https://kubernetes.default.svc:443
                - --deploy-mode
                - cluster
                - --name
                - raw-to-bronze
                - --conf
                - spark.kubernetes.namespace=spark
                - --conf
                - spark.kubernetes.authenticate.driver.serviceAccountName=spark
                - --conf
                - spark.kubernetes.container.image=spark-job-market:latest
                - --conf
                - spark.kubernetes.container.image.pullPolicy=IfNotPresent
                - --conf
                - spark.executor.instances=1
                - --conf
                - spark.executor.cores=1
                - --conf
                - spark.kubernetes.executor.request.cores=250m
                - --conf
                - spark.kubernetes.executor.limit.cores=500m
                - --conf
                - spark.kubernetes.driver.request.cores=250m
                - --conf
                - spark.kubernetes.driver.limit.cores=500m
                - --conf
                - spark.executor.memory=768m
                - --conf
                - spark.driver.memory=768m
                - --conf
                - spark.sql.shuffle.partitions=8
                - local:///opt/spark/work-dir/jobs/raw_to_bronze.py

              env:
                # HDFS namenode connection
                - name: HDFS_NAMENODE_URI
                  value: "hdfs://hdfs-namenode.hdfs.svc:9000"
                - name: RAW_BASE_PATH
                  value: "hdfs://hdfs-namenode.hdfs.svc:9000/raw/jobs"
                - name: BRONZE_BASE_PATH
                  value: "hdfs://hdfs-namenode.hdfs.svc:9000/bronze/jobs"

              resources:
                requests:
                  cpu: "500m"
                  memory: "512Mi"
                limits:
                  cpu: "1"
                  memory: "1Gi"
