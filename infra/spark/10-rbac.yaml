apiVersion: v1
kind: ServiceAccount
metadata:
  name: spark
  namespace: job-market
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: spark-role
  namespace: job-market
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "services", "configmaps", "persistentvolumeclaims"]
    verbs: ["create", "get", "list", "watch", "delete", "deletecollection", "update", "patch"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete", "deletecollection"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: spark-rolebinding
  namespace: job-market
subjects:
  - kind: ServiceAccount
    name: spark
    namespace: job-market
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: spark-role