# Kubernetes namespaces used by the job-market data platform.
#
# Namespaces separate infrastructure concerns:
#   hdfs     - HDFS storage
#   spark    - Spark jobs and batch/streaming workloads
#   search   - Elasticsearch and Kibana
#   kafka    - Kafka and Strimzi resources
#   serving  - API service
#   airflow  - Airflow orchestration
---
apiVersion: v1
kind: Namespace
metadata:
  name: spark
---
apiVersion: v1
kind: Namespace
metadata:
  name: search
---
apiVersion: v1
kind: Namespace
metadata:
  name: serving
---
apiVersion: v1
kind: Namespace
metadata:
  name: kafka
---
apiVersion: v1
kind: Namespace
metadata:
  name: airflow
