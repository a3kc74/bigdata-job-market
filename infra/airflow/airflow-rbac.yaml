# RBAC for Airflow to orchestrate Spark batch jobs.
#
# Airflow runs BashOperator tasks that call kubectl. These tasks need permission
# to create Jobs from suspended CronJobs in the spark namespace, watch their
# status, and read pod logs.
#
# This file creates:
#   - ServiceAccount: airflow
#   - Role in namespace spark
#   - RoleBinding from airflow namespace to spark namespace
#
# Apply:
#   kubectl apply -f infra/airflow/airflow-rbac.yaml
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: airflow
  namespace: airflow
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: airflow-spark-job-runner
  namespace: spark
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: airflow-spark-job-runner
  namespace: spark
subjects:
  - kind: ServiceAccount
    name: airflow
    namespace: airflow
roleRef:
  kind: Role
  name: airflow-spark-job-runner
  apiGroup: rbac.authorization.k8s.io
