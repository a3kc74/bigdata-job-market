# Kubernetes Service for the job-search FastAPI deployment.
#
# Local access:
#   kubectl port-forward svc/job-search-api 8001:8000 -n serving
---
apiVersion: v1
kind: Service
metadata:
  name: job-search-api
  namespace: serving
spec:
  type: ClusterIP
  selector:
    app: job-search-api
  ports:
    - name: http
      port: 8000
      targetPort: 8000
