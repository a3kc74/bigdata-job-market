apiVersion: sparkoperator.k8s.io/v1beta2
kind: SparkApplication
metadata:
  name: speed-job
  namespace: job-market
spec:
  type: Python
  pythonVersion: "3"
  mode: cluster
  image: spark-job-market:latest
  imagePullPolicy: IfNotPresent
  mainApplicationFile: local:///opt/spark/work-dir/speed_job.py
  sparkVersion: "4.0.0"
  restartPolicy:
    type: Never
  sparkConf:
    "spark.sql.shuffle.partitions": "2"
    "spark.kubernetes.container.image.pullPolicy": "IfNotPresent"
    "spark.hadoop.fs.s3a.endpoint": "http://minio:9000"
    "spark.hadoop.fs.s3a.access.key": "minioadmin"
    "spark.hadoop.fs.s3a.secret.key": "minioadmin123"
    "spark.hadoop.fs.s3a.path.style.access": "true"
    "spark.hadoop.fs.s3a.connection.ssl.enabled": "false"
    "spark.hadoop.fs.s3a.impl": "org.apache.hadoop.fs.s3a.S3AFileSystem"
    "spark.hadoop.fs.AbstractFileSystem.s3a.impl": "org.apache.hadoop.fs.s3a.S3A"
    "spark.jars.ivy": "/tmp/.ivy2.5.2"
    "spark.jars.packages": "org.apache.spark:spark-sql-kafka-0-10_2.13:4.0.0,org.apache.hadoop:hadoop-aws:3.4.1"
  driver:
    cores: 1
    memory: "768m"
    serviceAccount: spark
    env:
      - name: KAFKA_BOOTSTRAP_SERVERS
        value: "my-cluster-kafka-bootstrap.kafka:9092"
      - name: KAFKA_TOPIC
        value: "job-postings"
      - name: BRONZE_PATH
        value: "s3a://bronze/job_postings/"
      - name: SPEED_CHECKPOINT_PATH
        value: "s3a://bronze/checkpoints/speed_job/"
      - name: MONGODB_URI
        value: "mongodb://admin:admin123@mongodb:27017/admin"
      - name: MONGODB_DATABASE
        value: "job_market"
  executor:
    instances: 1
    cores: 1
    memory: "768m"