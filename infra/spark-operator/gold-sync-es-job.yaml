apiVersion: sparkoperator.k8s.io/v1beta2
kind: ScheduledSparkApplication
metadata:
  name: gold-sync-es-job
  namespace: job-market
spec:
  schedule: "30 * * * *"
  concurrencyPolicy: Forbid
  successfulRunHistoryLimit: 1
  failedRunHistoryLimit: 3
  template:
    type: Python
    pythonVersion: "3"
    mode: cluster
    image: spark-job-market:latest
    imagePullPolicy: IfNotPresent
    mainApplicationFile: local:///opt/spark/work-dir/gold_to_elasticsearch.py
    sparkVersion: "4.0.0"
    restartPolicy:
      type: Never
    sparkConf:
      "spark.sql.shuffle.partitions": "2"
      "spark.kubernetes.container.image.pullPolicy": "IfNotPresent"
      "spark.hadoop.fs.s3a.endpoint": "http://minio:9000"
      "spark.hadoop.fs.s3a.access.key": "minioadmin"
      "spark.hadoop.fs.s3a.secret.key": "minioadmin123"
      "spark.hadoop.fs.s3a.path.style.access": "true"
      "spark.hadoop.fs.s3a.impl": "org.apache.hadoop.fs.s3a.S3AFileSystem"
    driver:
      cores: 1
      memory: "512m"
      serviceAccount: spark
      env:
        - name: GOLD_JOBS_FLAT_PATH
          value: "s3a://gold/gold_jobs_flat/"
        - name: ES_HOST
          value: "https://topcv-es-http.elastic-stack.svc:9200"
        - name: ES_USER
          value: "elastic"
        - name: ES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: elasticsearch-secret
              key: password
        - name: ES_VERIFY_CERTS
          value: "false"
        - name: ES_INDEX
          value: "job-market-gold"
    executor:
      instances: 1
      cores: 1
      memory: "512m"
