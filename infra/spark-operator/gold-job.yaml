apiVersion: sparkoperator.k8s.io/v1beta2
kind: ScheduledSparkApplication
metadata:
  name: gold-job
  namespace: job-market
spec:
  schedule: "10 * * * *"
  concurrencyPolicy: Forbid
  successfulRunHistoryLimit: 1
  failedRunHistoryLimit: 3
  template:
    type: Python
    pythonVersion: "3"
    mode: cluster
    image: spark-job-market:latest
    imagePullPolicy: IfNotPresent
    mainApplicationFile: local:///opt/spark/work-dir/silver_to_gold.py
    sparkVersion: "4.0.0"
    restartPolicy:
      type: Never
    sparkConf:
      "spark.sql.shuffle.partitions": "2"
      "spark.kubernetes.container.image.pullPolicy": "IfNotPresent"
      "spark.hadoop.fs.s3a.endpoint": "http://minio:9000"
      "spark.hadoop.fs.s3a.access.key": "minioadmin"
      "spark.hadoop.fs.s3a.secret.key": "minioadmin123"
      "spark.hadoop.fs.s3a.path.style.access": "true"
      "spark.hadoop.fs.s3a.impl": "org.apache.hadoop.fs.s3a.S3AFileSystem"
    driver:
      cores: 1
      memory: "1g"
      serviceAccount: spark
      env:
        - name: SILVER_PATH
          value: "s3a://silver/job_postings/"
        - name: GOLD_JOBS_FLAT_PATH
          value: "s3a://gold/gold_jobs_flat/"
        - name: GOLD_DAILY_STATS_PATH
          value: "s3a://gold/gold_daily_stats/"
        - name: GOLD_SALARY_BUCKET_STATS_PATH
          value: "s3a://gold/gold_salary_bucket_stats/"
        - name: GOLD_LANGUAGE_STATS_PATH
          value: "s3a://gold/gold_language_salary_stats/"
        - name: GOLD_FRAMEWORK_STATS_PATH
          value: "s3a://gold/gold_framework_salary_stats/"
        - name: GOLD_CATEGORY_STATS_PATH
          value: "s3a://gold/gold_category_stats/"
    executor:
      instances: 1
      cores: 1
      memory: "1g"